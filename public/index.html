
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d101b">
  <meta name="description" content="NexAI — твой умный AI-помощник.">
  <title>NexAI — умный AI-помощник</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="logo">✦ NexAI</div>
      <div class="badge">Интернет + ИИ</div>
    </header>

    <section class="hero">
      <p class="eyebrow">Умный поиск</p>

      <h1>
        Спроси что угодно.<br>
        <span>Получи ответ с источниками.</span>
      </h1>

      <p class="subtitle">
        NexAI — твой умный AI-помощник, который помогает
        разбираться в вопросах и находить ответы.
      </p>

      <form id="askForm" class="search-box">
        <textarea
          id="question"
          rows="2"
          maxlength="4000"
          placeholder="Спроси что-нибудь у NexAI..."
        ></textarea>

        <div class="bottom">
          <span id="counter">0 / 4000</span>
          <button id="askButton" type="submit">Спросить ↗</button>
        </div>
      </form>

      <div class="examples">
        <button type="button">Какие новости технологий сегодня?</button>
        <button type="button">Объясни квантовые компьютеры простыми словами</button>
        <button type="button">Сравни два популярных смартфона</button>
      </div>
    </section>

    <section id="result" class="result hidden">
      <div class="head">● Ответ NexAI</div>
      <article id="answer"></article>
      <div id="sources"></div>
    </section>

    <footer>NexAI</footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
